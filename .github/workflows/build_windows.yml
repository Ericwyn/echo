name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        id: flutter-action
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify checked-in generated sources
        run: python scripts/check_generated_sources.py

      - name: Get version name
        id: version
        shell: pwsh
        run: |
          $line = (Get-Content pubspec.yaml | Where-Object { $_ -match '^version:\s*' } | Select-Object -First 1)
          if (-not $line) { throw "Cannot find version in pubspec.yaml" }
          $version = ($line -replace '^version:\s*', '').Trim().Split('+')[0]
          "name=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build Windows
        shell: pwsh
        run: |
          flutter build windows --release --no-pub `
            --dart-define="ECHO_BUILD_SOURCE=GitHub Actions" `
            --dart-define="ECHO_BUILD_COMMIT=${{ github.sha }}" `
            --dart-define="ECHO_FLUTTER_VERSION=${{ env.FLUTTER_VERSION }}"

      - name: Verify Windows executable
        shell: pwsh
        run: |
          $executable = 'build/windows/x64/runner/Release/echoes.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Windows executable not found: $executable"
          }

      - name: Upload Windows Build
        uses: actions/upload-artifact@v6
        with:
          name: echoes-windows-x64-${{ steps.version.outputs.name }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
