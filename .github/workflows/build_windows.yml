name: Build Windows

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        id: flutter-action
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify checked-in generated sources
        run: python scripts/check_generated_sources.py

      - name: Get version name
        id: version
        shell: pwsh
        run: |
          $line = (Get-Content pubspec.yaml | Where-Object { $_ -match '^version:\s*' } | Select-Object -First 1)
          if (-not $line) { throw "Cannot find version in pubspec.yaml" }
          $version = ($line -replace '^version:\s*', '').Trim().Split('+')[0]
          "name=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build Windows
        run: flutter build windows --release

      - name: Archive Windows Build
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath windows-release.zip `
            -Force

      - name: Upload Windows Build
        uses: actions/upload-artifact@v6
        with:
          name: windows-release-${{ steps.version.outputs.name }}
          path: windows-release.zip
          retention-days: 5
