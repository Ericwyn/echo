name: Build Android

on:
  workflow_dispatch:
    inputs:
      abis:
        description: Android APK architectures
        type: choice
        required: true
        default: arm64
        options:
          - arm64
          - all
      signing:
        description: APK signing key
        type: choice
        required: true
        default: release
        options:
          - release
          - debug
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve build options
        id: options
        env:
          REQUESTED_ABIS: ${{ inputs.abis }}
          REQUESTED_SIGNING: ${{ inputs.signing }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "abis=${REQUESTED_ABIS}" >> "$GITHUB_OUTPUT"
            echo "signing=${REQUESTED_SIGNING}" >> "$GITHUB_OUTPUT"
          else
            echo 'abis=all' >> "$GITHUB_OUTPUT"
            echo 'signing=release' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        id: flutter-action
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prepare release signing
        if: steps.options.outputs.signing == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          for secret_name in KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $secret_name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/echoes-release.jks"
          test -s "$RUNNER_TEMP/echoes-release.jks"

      - name: Install dependencies
        run: flutter pub get

      - name: Verify tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pubspec_version=$(grep '^version:' pubspec.yaml | head -n1 | awk '{print $2}' | cut -d'+' -f1)
          if [[ -z "$pubspec_version" ]]; then
            echo "Cannot find version in pubspec.yaml"
            exit 1
          fi
          expected_tag="v${pubspec_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pubspec version ${pubspec_version}"
            exit 1
          fi

      - name: Verify checked-in generated sources
        run: python3 scripts/check_generated_sources.py

      - name: Build release-signed APK
        if: steps.options.outputs.signing == 'release'
        env:
          TARGET_ABIS: ${{ steps.options.outputs.abis }}
          ECHO_STORE_FILE: ${{ runner.temp }}/echoes-release.jks
          ECHO_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          ECHO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ECHO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          build_metadata=(
            '--dart-define=ECHO_BUILD_SOURCE=GitHub Actions'
            "--dart-define=ECHO_BUILD_COMMIT=${GITHUB_SHA::12}"
            "--dart-define=ECHO_FLUTTER_VERSION=${FLUTTER_VERSION}"
          )
          if [[ "$TARGET_ABIS" == 'arm64' ]]; then
            flutter build apk --release --no-pub --split-per-abi --target-platform android-arm64 "${build_metadata[@]}"
          else
            flutter build apk --release --no-pub --split-per-abi "${build_metadata[@]}"
          fi

      - name: Build debug-signed APK
        if: steps.options.outputs.signing == 'debug'
        env:
          TARGET_ABIS: ${{ steps.options.outputs.abis }}
        run: |
          build_metadata=(
            '--dart-define=ECHO_BUILD_SOURCE=GitHub Actions'
            "--dart-define=ECHO_BUILD_COMMIT=${GITHUB_SHA::12}"
            "--dart-define=ECHO_FLUTTER_VERSION=${FLUTTER_VERSION}"
          )
          if [[ "$TARGET_ABIS" == 'arm64' ]]; then
            flutter build apk --release --no-pub --split-per-abi --target-platform android-arm64 "${build_metadata[@]}"
          else
            flutter build apk --release --no-pub --split-per-abi "${build_metadata[@]}"
          fi

      - name: Verify ARM64 APK metadata
        run: |
          apk='build/app/outputs/flutter-apk/app-arm64-v8a-release.apk'
          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          aapt="$build_tools_dir/aapt"
          test -s "$apk"
          test -x "$aapt"

          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          version_name="${version%%+*}"
          expected_code="${version##*+}"
          package_info="$("$aapt" dump badging "$apk" | sed -n '1p')"
          if [[ "$package_info" != *"name='com.az1n.echoes'"* ||
                "$package_info" != *"versionCode='$expected_code'"* ||
                "$package_info" != *"versionName='$version_name'"* ]]; then
            echo "::error::Unexpected APK package or version: $package_info"
            exit 1
          fi

      - name: Get package version
        id: version
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          echo "name=v${version}" >> "$GITHUB_OUTPUT"

      - name: Upload APK (arm64-v8a)
        uses: actions/upload-artifact@v6
        with:
          name: echoes-android-arm64-v8a-${{ steps.version.outputs.name }}-${{ steps.options.outputs.signing }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload APK (armeabi-v7a)
        if: steps.options.outputs.abis == 'all'
        uses: actions/upload-artifact@v6
        with:
          name: echoes-android-armeabi-v7a-${{ steps.version.outputs.name }}-${{ steps.options.outputs.signing }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload APK (x86_64)
        if: steps.options.outputs.abis == 'all'
        uses: actions/upload-artifact@v6
        with:
          name: echoes-android-x86_64-${{ steps.version.outputs.name }}-${{ steps.options.outputs.signing }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && steps.options.outputs.signing == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ github.ref_name }}
        run: |
          assets=(
            "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
            "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk"
            "build/app/outputs/flutter-apk/app-x86_64-release.apk"
          )

          release_body="$(git for-each-ref "refs/tags/$RELEASE_NAME" --format='%(contents)')"
          if [[ -z "$release_body" ]]; then
            release_body="$(git log --format=%s -n 1)"
          fi

          if gh release view "$RELEASE_NAME" >/dev/null 2>&1; then
            gh release edit "$RELEASE_NAME" --title "$RELEASE_NAME" --notes "$release_body"
          elif ! gh release create "$RELEASE_NAME" --title "$RELEASE_NAME" --notes "$release_body"; then
            gh release view "$RELEASE_NAME" >/dev/null
            gh release edit "$RELEASE_NAME" --title "$RELEASE_NAME" --notes "$release_body"
          fi

          asset_exists() {
            local asset_name="$1"
            gh release view "$RELEASE_NAME" --json assets --jq '.assets[].name' | grep -Fxq "$asset_name"
          }

          upload_asset() {
            local asset_path="$1"
            local asset_name
            asset_name="$(basename "$asset_path")"

            if asset_exists "$asset_name"; then
              echo "Release asset already exists, skipping: $asset_name"
              return 0
            fi

            if gh release upload "$RELEASE_NAME" "$asset_path"; then
              return 0
            fi

            if asset_exists "$asset_name"; then
              echo "Release asset appeared during upload, skipping: $asset_name"
              return 0
            fi

            echo "Failed to upload release asset: $asset_name"
            return 1
          }

          for asset in "${assets[@]}"; do
            upload_asset "$asset"
          done
