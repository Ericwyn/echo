name: Build macOS

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        id: flutter-action
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify checked-in generated sources
        run: python3 scripts/check_generated_sources.py

      - name: Get version name
        id: version
        run: |
          version=$(grep '^version:' pubspec.yaml | head -n1 | awk '{print $2}' | cut -d'+' -f1)
          echo "name=v${version}" >> $GITHUB_OUTPUT

      - name: Build macOS
        run: flutter build macos --release

      - name: Archive macOS Build
        run: cd build/macos/Build/Products/Release && zip -r ../../../../../macos-release.zip echo.app

      - name: Upload macOS Build
        uses: actions/upload-artifact@v6
        with:
          name: macos-release-${{ steps.version.outputs.name }}
          path: macos-release.zip
          retention-days: 5
