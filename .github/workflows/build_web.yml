name: Build Web

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        id: flutter-action
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify checked-in generated sources
        run: python3 scripts/check_generated_sources.py

      - name: Get version name
        id: version
        run: |
          version=$(grep '^version:' pubspec.yaml | head -n1 | awk '{print $2}' | cut -d'+' -f1)
          echo "name=v${version}" >> $GITHUB_OUTPUT

      - name: Build Web
        run: flutter build web --release

      - name: Archive Web Build
        run: cd build/web && zip -r ../../web-release.zip .

      - name: Upload Web Build
        uses: actions/upload-artifact@v6
        with:
          name: web-release-${{ steps.version.outputs.name }}
          path: web-release.zip
          retention-days: 5
