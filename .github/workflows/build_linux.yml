name: Build Linux

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev desktop-file-utils zip

      - uses: subosito/flutter-action@v2
        id: flutter-action
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Cache build_runner
        uses: actions/cache@v5
        with:
          path: .dart_tool/build
          key: ${{ runner.os }}-build-runner-${{ env.FLUTTER_VERSION }}-${{ hashFiles('lib/**/*.dart', 'test/**/*.dart', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-runner-${{ env.FLUTTER_VERSION }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Get package version
        id: version
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          echo "name=v${version}" >> $GITHUB_OUTPUT

      - name: Build Linux
        run: |
          flutter build linux --release --no-pub \
            --dart-define="ECHO_BUILD_SOURCE=GitHub Actions" \
            --dart-define="ECHO_BUILD_COMMIT=${GITHUB_SHA::12}" \
            --dart-define="ECHO_FLUTTER_VERSION=${FLUTTER_VERSION}"

      - name: Package Ubuntu deb
        run: bash scripts/package_linux_deb.sh

      - name: Upload Linux Build
        uses: actions/upload-artifact@v6
        with:
          name: linux-release-${{ steps.version.outputs.name }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build/linux/packages/*.deb
            build/linux/packages/*_linux-x64-bundle.zip
          if-no-files-found: error
          retention-days: 14
